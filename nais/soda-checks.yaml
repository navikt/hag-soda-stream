apiVersion: v1
kind: ConfigMap
metadata:
  name: soda-checks
  namespace: helsearbeidsgiver
data:
  lp_api_im_mottatt_65.yaml: |
    dataset: soda_dataset/{{ gcp.project_id }}/soda_dataset/lp_api_im_mottatt_65
    columns: []
    checks:
      - row_count:
          name: "Det finnes rader med status MOTTATT eldre enn 65 minutter"
          threshold:
            must_be: 0
  lps_api_bro_mismatch.yaml: |
    dataset: soda_dataset/{{ gcp.project_id }}/soda_dataset/lps_api_bro_mismatch
    columns: []
    checks:
      - row_count:
          name: "Det finnes forespørsler i lps_api som ikke har en matchende status i bro"
          threshold:
            must_be: 0
  faisu_forlengelser.yaml: |
    dataset: soda_dataset/{{ gcp.project_id }}/soda_dataset/faisu_forlengelser
    columns: []
    checks:
      - row_count:
          name: "Sykmelding periode er forlenget med ulik grad med flere arbeidsforhold i samme underenhet"
          threshold:
            must_be: 0